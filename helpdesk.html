<!DOCTYPE html>
<html lang="en">

    <head>
       <meta charset="utf-8" >
       <meta name="description" content="help desk appointment form" />
       <meta name="keywords" content="HTML, Form, tags" />
       <meta name="author" content="Redha Waseem"  />
        <title>CWA Help Desk Appointment</title>
    </head> 
    
    <body>
        
    <p>
        <a href="https://www.swinburne.edu.au/"
         target="_blank" 
         title="Go to Swinburne University Website">
         <img src="logo.png" alt="Swinburne University Logo" width="200" height="100">
        </a>
    </p>

    <h1>CWA Help Desk Appointment</h1>
    <p>The Help desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday.</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>
    <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">
	<!--Note we have to use a special escape character to print an apostrophe on the Web page -->
    <fieldset>
		<legend>Student Details</legend>
        <p><label for=" Studentid">Student&apos;s ID</label> 
		<input type="text" pattern="[0-9]{7-10}" maxlength="10" name= "Studentid" id="studentid" required="required"/>
        </p>
		<p><label for="Given Name">Given Name</label> 
		<input type="text" name= "Given Name" pattern="[A-Za-z]+" id="Given Name" maxlength="15" size="10" required="required"/>
	
        <label for="Family Name">Family Name</label> 
		<input type="text" name= "Family Name" id="Family Name" maxlength="15" required="required"/>
	    </p> 
    </fieldset>
    <fieldset>
        <legend>Your Unit</legend>
        <label for="COS10011">COS10011</label> 
		<input type="radio" id="COS10011" name="COS10011" value="COS10011"/>
		
		<label for="COS60004">COS60004</label> 
		<input type="radio" id="COS60004" name="COS60004" value="COS60004"/>
		<label for="COS60007">COS60007</label>
        <input type="radio" id="COS60007" name="COS60007" value="COS60007"/>
        <p>
        <label for="your tutor">Your Tutor</label> 
		<select id="Tutor" name="Tutor">
			<option value="blank">Please select</option>			
			<option value="Maryam">Maryam </option>
			<option value="Ismail">Ismail </option>
			<option value="Redha">Redha</option>
			</select>
		</p>
    </fieldset>   
	
	<fieldset>
        <legend>Issue </legend>
		<p><label for="html">HTML</label> 
		<input type="checkbox" id="html" name="category[]" value="best" checked="checked"/>
		<label for="css">CSS</label> 
		<input type="checkbox" id="css" name="category[]" value="cute"/>
	    <label for="javascript">JavaScript</label> 
		<input type="checkbox" id="javascript" name="category[]" value="javascript"/>
        <label for="php">PHP</label> 
		<input type="checkbox" id="php" name="category[]" value="php"/>
        <label for="mysql">MySQL</label> 
		<input type="checkbox" id="mysql" name="category[]" value="mysql"/>
		<p><label for="comments">Description of Issue</label></p>
	    <p><textarea id="comments" name="comments" rows="4" cols="40" placeholder="Write description of your problem here..."></textarea>
		</p>
	</fieldset>
        
    <fieldset> 
        <legend>Preffered Date/Time</legend>
		<p><label for="date">Date</label> 
			<input type="text" name= "date" id="date" placeholder="dd/mm/yyyy" maxlength="10" size="10"pattern="\d{2}/\d{2}/\d{4}"/>
		</p>
		<p><label for="time">Time</label> 
			<input type="text" name= "time" id="time" placeholder="00:00" maxlength="5" size="5" pattern="\d{2}:\d{2}"/>
		</p>
        <p>
	       <input type= "submit" value="Book"/>
	       <input type= "reset" value="Reset Form"/>
        </p>
    </fieldset>
</form>

     </body>
</html>
